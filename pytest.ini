; configuration files like POM.xml

# content of pytest.ini
[pytest]
# Run firefox with UI
addopts = --browser chromium --slowmo 300 --device "Desktop Firefox" --output test-results --tracing retain-on-failure --video  retain-on-failure --screenshot only-on-failure --html reports/report.html --self-contained-html
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: Quick sanity check suite
    regression: Comprehensive regression suite
    auth: Authentication and login flows

; log_cli = true
; log_cli_level = INFO
; log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
; log_cli_date_format = %Y-%m-%d %H:%M:%S

; log_file = logs/pytest_execution.log
; log_file_level = DEBUG
; log_file_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
; log_file_date_format = %Y-%m-%d %H:%M:%S